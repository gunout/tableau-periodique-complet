<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🌌 Tableau Périodique Complet — Classification Historique & Spectrale</title>
<style>
:root{
  --bleu:#002395;
  --bleu-clair:#1D4ED8;
  --bleu-moyen:#3B82F6;
  --bleu-pale:#DBEAFE;
  --bleu-tres-pale:#EFF6FF;
  --rouge:#ED2939;
  --rouge-fonce:#C8102E;
  --blanc:#ffffff;
  --bg:#f7fafd;
  --panel:#ffffff;
  --border:#dbe6f3;
  --text:#0f172a;
  --muted:#64748b;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
  font-size:15px;
  padding-top:6px;
}

/* ===== Bande tricolore ===== */
.tricolore{
  position:fixed;top:0;left:0;right:0;height:6px;z-index:100;display:flex;
  box-shadow:0 1px 4px rgba(0,0,0,.15);
}
.tricolore i{flex:1;}
.tricolore i:nth-child(1){background:#002395;}
.tricolore i:nth-child(2){background:#ffffff;}
.tricolore i:nth-child(3){background:#ED2939;}

.app{display:flex;min-height:100vh;align-items:flex-start;}

/* ================= SIDEBAR ================= */
.sidebar{
  width:300px;flex:0 0 300px;
  background:linear-gradient(180deg,#f0f6ff 0%,#e6f0fc 100%);
  border-right:1px solid var(--border);
  padding:24px 16px 40px;
  height:100vh;
  position:sticky;top:0;
  overflow-y:auto;
}
.sidebar h2{
  font-size:1rem;margin:0 0 16px;color:var(--bleu);
  letter-spacing:.3px;font-weight:800;
  display:flex;align-items:center;gap:8px;
}
.sidebar h2::before{
  content:'';width:6px;height:20px;border-radius:3px;
  background:linear-gradient(180deg,var(--bleu),var(--rouge));
}
.sidebar h3{
  font-size:.73rem;text-transform:uppercase;letter-spacing:.1em;
  color:var(--bleu-clair);margin:22px 0 9px;font-weight:800;
  border-bottom:1px dashed #c7d9ee;padding-bottom:6px;
}
.nav{display:flex;flex-direction:column;gap:5px;}
.nav-btn{
  text-align:left;padding:10px 13px;border-radius:9px;border:1px solid transparent;
  background:transparent;color:#334155;font-size:.87rem;cursor:pointer;
  transition:.18s;font-family:inherit;font-weight:500;
}
.nav-btn:hover{background:#dce9fa;color:var(--bleu);}
.nav-btn.active{
  background:linear-gradient(90deg,var(--bleu),var(--bleu-clair));
  color:#fff;font-weight:700;
  box-shadow:0 4px 12px rgba(0,35,149,.3);
}
.filter-list{display:flex;flex-direction:column;gap:5px;max-height:240px;overflow-y:auto;padding-right:4px;}
.filter-item{
  display:flex;align-items:center;gap:9px;font-size:.8rem;cursor:pointer;
  padding:5px 7px;border-radius:7px;color:#334155;transition:.15s;
}
.filter-item:hover{background:#dce9fa;}
.filter-item input{accent-color:var(--bleu-clair);cursor:pointer;width:14px;height:14px;}
.swatch{width:12px;height:12px;border-radius:3px;flex:0 0 12px;border:1px solid rgba(0,0,0,.18);}
.opt-row{display:flex;align-items:center;gap:9px;font-size:.81rem;margin:7px 0;color:#334155;cursor:pointer;}
.opt-row input{accent-color:var(--rouge);cursor:pointer;width:14px;height:14px;}

/* ================= MAIN ================= */
.main{flex:1;min-width:0;padding:28px 34px 70px;}
.main-header{
  font-size:2.2rem;font-weight:900;text-align:center;line-height:1.18;
  background:linear-gradient(90deg,#002395 0%,#1D4ED8 45%,#ED2939 100%);
  -webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;color:transparent;
  margin:0 0 .7rem;letter-spacing:-.5px;
}
.sub-header{
  text-align:center;color:var(--muted);font-size:.9rem;margin-bottom:28px;
  line-height:1.6;max-width:820px;margin-left:auto;margin-right:auto;
}
.sub-header strong{color:var(--bleu);}
.section-header{
  color:var(--bleu);font-size:1.02rem;font-weight:800;letter-spacing:.02em;
  border-bottom:3px solid transparent;
  border-image:linear-gradient(90deg,var(--bleu),var(--bleu-moyen),var(--rouge)) 1;
  padding-bottom:.5rem;margin:36px 0 18px;
  display:flex;align-items:center;gap:10px;
}
.section-header:first-of-type{margin-top:8px;}

/* ================= TABLEAU PÉRIODIQUE ================= */
.ptable-wrap{overflow-x:auto;padding-bottom:14px;}
.ptable{
  display:grid;
  grid-template-columns:repeat(18,minmax(54px,1fr));
  gap:5px;
  min-width:1040px;
}
.pcell{
  aspect-ratio:1/1;border-radius:8px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-size:.7rem;line-height:1.05;position:relative;
  transition:transform .18s cubic-bezier(.34,1.56,.64,1),box-shadow .18s,opacity .25s;
  user-select:none;cursor:pointer;
  border:1px solid rgba(255,255,255,.45);
}
.pcell strong{font-size:.9rem;font-weight:800;letter-spacing:-.3px;}
.pcell span{font-size:.6rem;opacity:.85;font-weight:600;}
.pcell.empty{background:transparent;border:none;cursor:default;}
.pcell.label{
  font-size:.6rem;font-weight:800;color:var(--bleu);
  white-space:nowrap;overflow:visible;background:transparent;border:none;
  justify-content:center;align-items:flex-end;cursor:default;
  letter-spacing:.06em;text-transform:uppercase;
}
.pcell:not(.empty):not(.label):hover{
  transform:scale(1.16) translateY(-2px);
  box-shadow:0 8px 20px rgba(0,35,149,.35);z-index:10;
}
.pcell.dimmed{opacity:.13;filter:grayscale(.55);}

.legend{
  display:flex;flex-wrap:wrap;gap:12px 18px;margin:14px 0 20px;
  font-size:.76rem;color:#334155;
  background:#fff;border:1px solid var(--border);border-radius:11px;
  padding:12px 16px;
}
.legend span{display:flex;align-items:center;gap:7px;font-weight:500;}
.legend .dot{width:13px;height:13px;border-radius:4px;border:1px solid rgba(0,0,0,.1);}

/* ================= CARTES ÉPOQUES ================= */
.epoch-banner{
  border-radius:12px;padding:14px 20px;margin:24px 0 14px;
  border-left:6px solid #999;display:flex;align-items:center;gap:16px;
  box-shadow:0 1px 4px rgba(0,0,0,.05);
}
.epoch-banner h3{margin:0 0 3px;font-size:1rem;font-weight:800;}
.epoch-banner p{margin:0;font-size:.78rem;opacity:.88;}

.cards-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
  gap:11px;margin-bottom:8px;
}
.discovery-card{
  background:#fff;border:1px solid var(--border);border-radius:11px;
  padding:12px 9px;text-align:center;color:#1e293b;
  box-shadow:0 1px 3px rgba(0,35,149,.05);transition:.22s;
}
.discovery-card:hover{
  box-shadow:0 8px 20px rgba(0,35,149,.14);
  transform:translateY(-3px);border-color:var(--bleu-moyen);
}
.discovery-card h4{margin:0 0 6px;font-size:1.15rem;color:var(--bleu);font-weight:800;}
.discovery-card .nm{font-weight:700;font-size:.82rem;display:block;margin-bottom:4px;}
.discovery-card small{display:block;font-size:.69rem;color:var(--muted);line-height:1.45;}
.rgb-spectrum{height:14px;border-radius:7px;margin:8px 0;border:1px solid rgba(0,0,0,.1);}

/* ================= TABS ================= */
.tabs{
  display:flex;gap:6px;border-bottom:2px solid var(--border);
  margin-bottom:20px;flex-wrap:wrap;
}
.tab{
  padding:9px 18px;border:none;background:transparent;cursor:pointer;
  font-family:inherit;font-size:.85rem;color:var(--muted);
  border-radius:9px 9px 0 0;transition:.18s;font-weight:600;
}
.tab:hover{background:var(--bleu-tres-pale);color:var(--bleu);}
.tab.active{
  background:linear-gradient(180deg,#fff,#f0f6ff);
  color:var(--bleu);font-weight:800;
  box-shadow:0 -3px 0 var(--rouge) inset;
}

/* ================= CHIPS ================= */
.chip-row{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));
  gap:10px;margin-bottom:14px;
}
.chip{
  border-radius:10px;padding:9px 7px;text-align:center;font-size:.74rem;
  border:1px solid rgba(0,0,0,.07);background:#fff;transition:.2s;
}
.chip:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,35,149,.15);}
.chip strong{display:block;font-size:.98rem;font-weight:800;}
.chip .bar{height:12px;border-radius:6px;margin:6px 0;border:1px solid rgba(0,0,0,.08);}
.sub-title{font-weight:800;color:var(--bleu);margin:20px 0 10px;font-size:.93rem;}

/* ================= FORMULAIRES ================= */
select,input[type=text]{
  font-family:inherit;font-size:.87rem;padding:9px 12px;border-radius:9px;
  border:1px solid var(--border);background:#fff;color:var(--text);outline:none;
  transition:.18s;
}
select:focus{border-color:var(--bleu-moyen);box-shadow:0 0 0 3px rgba(59,130,246,.18);}
select[multiple]{padding:5px;min-width:230px;min-height:180px;}
select[multiple] option{padding:5px 9px;border-radius:5px;margin-bottom:2px;}
select[multiple] option:checked{background:linear-gradient(90deg,var(--bleu),var(--bleu-clair));color:#fff;}

/* ================= EXPLORATEUR ================= */
.explorer-top{
  border-radius:16px;padding:26px;text-align:center;margin-bottom:20px;
  border:2px solid var(--bleu-moyen);
  background:linear-gradient(135deg,#f0f6ff,#fff);
  box-shadow:0 4px 18px rgba(0,35,149,.08);
}
.explorer-circle{
  width:112px;height:112px;border-radius:50%;margin:16px auto;
  border:4px solid #fff;box-shadow:0 8px 22px rgba(0,35,149,.28);
}
.info-grid{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
  gap:15px;
}
.info-card{
  background:#fff;border:1px solid var(--border);border-radius:12px;
  padding:16px 18px;box-shadow:0 1px 4px rgba(0,35,149,.05);
  border-top:3px solid var(--bleu-moyen);
}
.info-card h4{
  margin:0 0 12px;color:var(--bleu);font-size:.85rem;
  letter-spacing:.04em;text-transform:uppercase;font-weight:800;
}
.info-card p{margin:5px 0;font-size:.82rem;line-height:1.55;}
.info-card strong{color:#334155;font-weight:700;}

/* ================= DIVERS ================= */
.footer{
  margin-top:50px;text-align:center;color:var(--muted);font-size:.78rem;
  line-height:1.8;border-top:2px solid transparent;
  border-image:linear-gradient(90deg,var(--bleu),#fff,var(--rouge)) 1;
  padding-top:20px;
}
.chart-box{
  background:#fff;border:1px solid var(--border);border-radius:13px;
  padding:16px;box-shadow:0 1px 5px rgba(0,35,149,.05);
  margin-bottom:18px;overflow-x:auto;
}
.chart-box svg{display:block;width:100%;height:auto;min-width:520px;}
details{margin:10px 0 20px;}
details summary{
  cursor:pointer;color:var(--bleu-clair);font-size:.81rem;font-weight:700;
  padding:7px 0;outline:none;transition:.15s;
}
details summary:hover{color:var(--rouge);}
.empty-msg{color:var(--muted);font-style:italic;font-size:.85rem;padding:12px 0;text-align:center;}

@media (max-width:900px){
  .app{flex-direction:column;}
  .sidebar{width:100%;flex:1 1 auto;height:auto;position:relative;border-right:none;border-bottom:1px solid var(--border);}
  .main{padding:20px 16px 60px;}
  .main-header{font-size:1.45rem;}
  .ptable{grid-template-columns:repeat(18,minmax(44px,1fr));min-width:840px;}
  .pcell strong{font-size:.78rem;}
}
</style>
</head>

/* =========================================================================

const state = {

/* =========================================================================
   3. UTILITAIRES
   ========================================================================= */
const byZ = {}; ELEMENTS.forEach(e => byZ[e.Z] = e);
const byS = {}; ELEMENTS.forEach(e => byS[e.s] = e);

function esc(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function lum(hex){
  const r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
  return 0.299*r + 0.587*g + 0.114*b;
}
function txtOn(hex){ return lum(hex) > 165 ? '#0f172a' : '#ffffff'; }
function hexToRgb(hex){
  return [parseInt(hex.slice(1,3),16), parseInt(hex.slice(3,5),16), parseInt(hex.slice(5,7),16)];
}
function catHex(cat){ return CAT_COLORS[cat] || '#94a3b8'; }
function spectralRgb(sym){
  if (SPECTRAL[sym]) return SPECTRAL[sym].rgb;
  const el = byS[sym];
  if (el) return hexToRgb(catHex(el.cat));
  return [148,163,184];
}
function yearLabel(y){ return y > 0 ? y : 'Antiquité'; }
function isVisible(el){
  return state.epochs.has(el.ep) && state.categories.has(el.cat);
}

function renderMain(){

function attachMainListeners(){
  const m = document.getElementById('mainContent');

  // Clic sur une case du tableau périodique → explorateur
  m.querySelectorAll('.pcell[data-sym]').forEach(cell => {
    cell.onclick = () => {

      state.section = "Explorateur d'Éléments";
      render();
      window.scrollTo({top:0,behavior:'smooth'});

  });

  // Onglets spectraux
  m.querySelectorAll('.tab[data-tab]').forEach(t => {
    t.onclick = () => { state.spectralTab = t.dataset.tab; renderMain(); };
  });

  // Sélecteur de l'explorateur

  if (sel){
    sel.onchange = () => { state.explorerElement = sel.value; renderMain(); };

      renderMain();
    };
  }
}

/* ---------------------------------------------------------------------

function sectionPeriodicTable(){
  let grid = '';
  LAYOUT.forEach(row => {
    row.forEach(cell => {
      if (cell === 0 || cell === null){
        grid += `<div class="pcell empty"></div>`;
      } else if (typeof cell === 'string'){
        grid += `<div class="pcell label">${esc(cell)}</div>`;
      } else {
        const el = byZ[cell];
        if (!el){ grid += `<div class="pcell empty"></div>`; return; }
        const hex = catHex(el.cat);
        const tc = txtOn(hex);
        const vis = isVisible(el);
        grid += `
          <div class="pcell ${vis?'':'dimmed'}" data-sym="${el.s}"
               style="background:${hex};color:${tc}"
               title="${esc(el.n)} — ${esc(el.cat)} — Découvert ${esc(yearLabel(el.date))} par ${esc(el.dec)}">
            <strong>${esc(el.s)}</strong>
            <span>${el.Z}</span>
          </div>`;
      }
    });
  });

  const legend = CATEGORIES.map(c => `
    <span><span class="dot" style="background:${catHex(c)}"></span>${esc(c)}</span>
  `).join('');

  return `
    <h3 class="section-header">🧪 TABLEAU PÉRIODIQUE COMPLET — CLASSÉ PAR DATE DE DÉCOUVERTE</h3>
    <div class="legend">${legend}</div>
    <div class="ptable-wrap"><div class="ptable">${grid}</div></div>
  `;
}

/* ---------------------------------------------------------------------
   SECTION : Frise chronologique
   --------------------------------------------------------------------- */
function sectionTimeline(){
  const W = 1020, H = 470;
  const padL = 58, padR = 28, padT = 22, padB = 58;
  const plotW = W - padL - padR, plotH = H - padT - padB;
  const xMin = 0, xMax = 2030;
  const x = yr => padL + (yr - xMin) / (xMax - xMin) * plotW;
  const y = z => padT + plotH - (z - 1) / 117 * plotH;

  // Grille
  let grid = '';
  for (let yr = 0; yr <= 2000; yr += 250){
    grid += `<line x1="${x(yr)}" y1="${padT}" x2="${x(yr)}" y2="${padT+plotH}" stroke="#e2e8f0" stroke-width="1"/>`;
    grid += `<text x="${x(yr)}" y="${H-padB+20}" text-anchor="middle" font-size="11" fill="#64748b">${yr}</text>`;
  }
  for (let z = 1; z <= 118; z += 10){
    grid += `<line x1="${padL}" y1="${y(z)}" x2="${padL+plotW}" y2="${y(z)}" stroke="#eef2f8" stroke-width="1"/>`;
    grid += `<text x="${padL-9}" y="${y(z)+4}" text-anchor="end" font-size="11" fill="#64748b">${z}</text>`;
  }

  // Points
  let pts = '';
  ELEMENTS.forEach(el => {
    const ep = EPOCHS.find(e => e.nom === el.ep);
    const vis = isVisible(el);
    const cx = x(Math.max(0, Math.min(2030, el.date)));
    const cy = y(el.Z);
    pts += `<circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="5" fill="${ep.point}" stroke="#fff" stroke-width="1.3" opacity="${vis?0.95:0.08}">
      <title>${esc(el.n)} (${el.s}) — ${esc(yearLabel(el.date))} — ${esc(el.dec)}</title>
    </circle>`;
  });

  const legend = EPOCHS.map(e => `
    <span style="display:inline-flex;align-items:center;gap:6px;margin-right:16px;font-size:.78rem;color:#334155">
      <span style="width:12px;height:12px;border-radius:50%;background:${e.point};display:inline-block"></span>${esc(e.nom)}
    </span>`).join('');

  return `
    <h3 class="section-header">📅 FRISE CHRONOLOGIQUE DES DÉCOUVERTES</h3>
    <div class="chart-box">
      <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">
        ${grid}
        <line x1="${padL}" y1="${padT+plotH}" x2="${padL+plotW}" y2="${padT+plotH}" stroke="#94a3b8" stroke-width="1.2"/>
        <line x1="${padL}" y1="${padT}" x2="${padL}" y2="${padT+plotH}" stroke="#94a3b8" stroke-width="1.2"/>
        <text x="${padL+plotW/2}" y="${H-8}" text-anchor="middle" font-size="12" fill="#475569" font-weight="600">Année de découverte</text>
        <text x="16" y="${padT+plotH/2}" text-anchor="middle" font-size="12" fill="#475569" font-weight="600" transform="rotate(-90 16 ${padT+plotH/2})">Numéro atomique</text>
        ${pts}
      </svg>
    </div>
    <div style="text-align:center;margin-bottom:14px">${legend}</div>
  `;
}

/* ---------------------------------------------------------------------
   SECTION : Analyse spectrale (avec onglets)

function sectionSpectral(initialTab){
  const tab = initialTab || state.spectralTab;

  let tabsHtml = `
    <div class="tabs">
      <button class="tab ${tab==='categorie'?'active':''}" data-tab="categorie">Par catégorie</button>
      <button class="tab ${tab==='epoque'?'active':''}" data-tab="epoque">Par époque</button>
      <button class="tab ${tab==='comparaison'?'active':''}" data-tab="comparaison">Comparaison</button>
    </div>`;

  let content = '';

  if (tab === 'categorie'){
    content = '<div class="sub-title">Palettes spectrales par catégorie chimique</div>';
    CATEGORIES.forEach(cat => {
      if (!state.categories.has(cat)) return;
      const els = ELEMENTS.filter(e => e.cat === cat);
      if (!els.length) return;
      content += `<div class="sub-title" style="font-size:.85rem;color:#334155">${esc(cat)} <span style="color:#94a3b8;font-weight:500">(${els.length} éléments)</span></div>`;
      content += `<div class="chip-row">`;
      els.forEach(el => {
        const rgb = spectralRgb(el.s);
        const hex = `#${rgb.map(v=>v.toString(16).padStart(2,'0')).join('')}`;
        content += `
          <div class="chip" style="background:${hex}22">
            <strong>${esc(el.s)}</strong>
            <div class="bar" style="background:linear-gradient(90deg,${hex}80,${hex})"></div>
            <div style="color:#475569">${esc(el.n)}</div>
          </div>`;
      });
      content += `</div>`;
    });
  }

  else if (tab === 'epoque'){
    content = '<div class="sub-title">Signature spectrale moyenne par époque</div>';
    EPOCHS.forEach(ep => {
      if (!state.epochs.has(ep.nom)) return;
      const els = ELEMENTS.filter(e => e.ep === ep.nom && state.categories.has(e.cat));
      if (!els.length) return;
      const rgbs = els.map(e => spectralRgb(e.s));
      const avg = [0,1,2].map(i => Math.round(rgbs.reduce((a,r)=>a+r[i],0) / rgbs.length));
      const hex = `#${avg.map(v=>v.toString(16).padStart(2,'0')).join('')}`;
      const tc = txtOn(hex);
      content += `
        <div style="display:flex;align-items:center;margin:12px 0;padding:15px 18px;border-radius:12px;background:linear-gradient(135deg,${hex}22,${hex}66);border:1px solid ${hex}55">
          <div style="width:64px;height:64px;background:${hex};border-radius:9px;margin-right:18px;border:3px solid #fff;box-shadow:0 3px 10px rgba(0,0,0,.15);display:flex;align-items:center;justify-content:center;color:${tc};font-weight:800;font-size:.72rem">RGB</div>
          <div style="flex:1">
            <h4 style="margin:0 0 4px;color:#0f172a">${esc(ep.nom)} <span style="font-weight:500;color:#64748b">(${esc(ep.periode)})</span></h4>
            <p style="margin:0;font-size:.8rem;color:#334155">${esc(ep.desc)} — <strong>${els.length} élément${els.length>1?'s':''}</strong> — rgb(${avg.join(', ')})</p>
          </div>
        </div>`;
    });
    if (!content.includes('rgb(')) content += `<div class="empty-msg">Aucune époque sélectionnée.</div>`;
  }

  else { // comparaison
    content = `
      <div class="sub-title">Sélectionnez des éléments à comparer</div>
      <select id="compareSelect" multiple size="8">
        ${ELEMENTS.map(e => `<option value="${e.s}" ${state.compare.includes(e.s)?'selected':''}>${e.s} — ${esc(e.n)}</option>`).join('')}
      </select>
      <div style="margin-top:16px">${comparisonChart(state.compare)}</div>
    `;
  }

  return `
    <h3 class="section-header">🌈 ANALYSE SPECTRALE COMPLÈTE</h3>
    ${tabsHtml}
    ${content}
  `;
}

function comparisonChart(symbols){
  if (!symbols || !symbols.length) return `<div class="empty-msg">Sélectionnez au moins un élément.</div>`;

  const W = 920, H = 330;
  const padL = 48, padR = 22, padT = 22, padB = 48;
  const plotW = W - padL - padR, plotH = H - padT - padB;
  const wlMin = 380, wlMax = 780;
  const x = wl => padL + (wl - wlMin) / (wlMax - wlMin) * plotW;
  const y = v => padT + plotH - v * plotH;

  let grid = '';
  for (let wl = 400; wl <= 780; wl += 50){
    grid += `<line x1="${x(wl)}" y1="${padT}" x2="${x(wl)}" y2="${padT+plotH}" stroke="#e2e8f0"/>`;
    grid += `<text x="${x(wl)}" y="${H-padB+20}" text-anchor="middle" font-size="11" fill="#64748b">${wl}</text>`;
  }
  for (let v = 0; v <= 1.001; v += 0.25){
    grid += `<line x1="${padL}" y1="${y(v)}" x2="${padL+plotW}" y2="${y(v)}" stroke="#eef2f8"/>`;
    grid += `<text x="${padL-9}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="#64748b">${v.toFixed(2)}</text>`;
  }

  let paths = '', legend = '';
  symbols.forEach(sym => {
    const info = SPECTRAL[sym];
    const rgb = spectralRgb(sym);
    const col = `rgb(${rgb.join(',')})`;
    let d = '';
    for (let i = 0; i <= 220; i++){
      const wl = wlMin + (wlMax - wlMin) * i / 220;
      let v = 0;
      if (info){
        if (info.wl >= wlMin && info.wl <= wlMax)
          v += 0.85 * Math.exp(-0.5 * Math.pow((wl - info.wl) / 14, 2));
        (info.sec || []).forEach(s => {
          if (s >= wlMin && s <= wlMax) v += 0.4 * Math.exp(-0.5 * Math.pow((wl - s) / 10, 2));
        });
      }
      v = Math.min(1, v);
      d += (i === 0 ? 'M' : 'L') + ` ${x(wl).toFixed(2)} ${y(v).toFixed(2)} `;
    }
    paths += `<path d="${d}" fill="none" stroke="${col}" stroke-width="2.4" opacity="0.92"/>`;
    legend += `<span style="display:inline-flex;align-items:center;gap:6px;margin:0 14px 6px 0;font-size:.79rem;color:#334155"><span style="width:16px;height:4px;background:${col};display:inline-block;border-radius:2px"></span>${sym} — ${esc(byS[sym] ? byS[sym].n : '')}</span>`;
  });

  return `
    <div class="chart-box">
      <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">
        <rect x="${padL}" y="${padT}" width="${plotW}" height="${plotH}" fill="url(#visibleSpectrum)" opacity="0.11"/>
        ${grid}
        <line x1="${padL}" y1="${padT+plotH}" x2="${padL+plotW}" y2="${padT+plotH}" stroke="#94a3b8" stroke-width="1.2"/>
        <line x1="${padL}" y1="${padT}" x2="${padL}" y2="${padT+plotH}" stroke="#94a3b8" stroke-width="1.2"/>
        <text x="${padL+plotW/2}" y="${H-8}" text-anchor="middle" font-size="12" fill="#475569" font-weight="600">Longueur d'onde (nm)</text>
        <text x="14" y="${padT+plotH/2}" text-anchor="middle" font-size="12" fill="#475569" font-weight="600" transform="rotate(-90 14 ${padT+plotH/2})">Intensité relative</text>
        ${paths}
      </svg>
      <div style="margin-top:10px;text-align:center">${legend}</div>
    </div>`;
}

      <div class="info-card">
        <h4>📜 Données historiques</h4>
        <p><strong>Numéro atomique :</strong> ${el.Z}</p>
        <p><strong>Date de découverte :</strong> ${esc(yearLabel(el.date))}</p>
        <p><strong>Découvreur :</strong> ${esc(el.dec)}</p>
        <p><strong>Période historique :</strong> ${esc(el.ep)}</p>
        <p><strong>Période :</strong> ${el.p} · <strong>Groupe :</strong> ${el.g}</p>
      </div>
      <div class="info-card">
        <h4>⚛️ Propriétés atomiques</h4>
        <p><strong>Masse atomique :</strong> ${el.m} u</p>
        <p><strong>Configuration électronique :</strong> ${esc(el.cfg)}</p>
        <p><strong>Catégorie :</strong> ${esc(el.cat)}</p>
      </div>
      <div class="info-card">
        <h4>🌈 Données spectrales</h4>
        ${info ? `
          <p><strong>Couleur RGB :</strong> ${rgb.join(', ')}</p>
          <p><strong>Longueur d'onde principale :</strong> ${info.wl} nm</p>
          <p><strong>Raies caractéristiques :</strong><br>${info.lines.map(esc).join('<br>')}</p>
        ` : `
          <p><strong>Couleur RGB estimée :</strong> ${rgb.join(', ')}</p>
          <p style="color:#94a3b8"><em>Aucune raie spectrale répertoriée dans cette base pour cet élément.</em></p>
        `}
      </div>
    </div>

    ${state.showSpectra ? `
      <div style="margin-top:20px">
        <div class="sub-title">Spectre simulé de ${esc(el.s)}</div>
        ${spectrumChart(el.s)}
      </div>
    ` : ''}
  `;
}

function spectrumChart(sym){
  const info = SPECTRAL[sym];
  const rgb = spectralRgb(sym);
  const col = `rgb(${rgb.join(',')})`;

  const W = 900, H = 260;
  const padL = 48, padR = 22, padT = 22, padB = 48;
  const plotW = W - padL - padR, plotH = H - padT - padB;
  const wlMin = 380, wlMax = 780;
  const x = wl => padL + (wl - wlMin) / (wlMax - wlMin) * plotW;
  const y = v => padT + plotH - v * plotH;

  let grid = '';
  for (let wl = 400; wl <= 780; wl += 50){
    grid += `<line x1="${x(wl)}" y1="${padT}" x2="${x(wl)}" y2="${padT+plotH}" stroke="#e2e8f0"/>`;
    grid += `<text x="${x(wl)}" y="${H-padB+20}" text-anchor="middle" font-size="11" fill="#64748b">${wl}</text>`;
  }
  for (let v = 0; v <= 1.001; v += 0.25){
    grid += `<line x1="${padL}" y1="${y(v)}" x2="${padL+plotW}" y2="${y(v)}" stroke="#eef2f8"/>`;
    grid += `<text x="${padL-9}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="#64748b">${v.toFixed(2)}</text>`;
  }

  // Construire la courbe
  let d = '';
  const N = 240;
  for (let i = 0; i <= N; i++){
    const wl = wlMin + (wlMax - wlMin) * i / N;
    let v = 0;
    if (info){
      if (info.wl >= wlMin && info.wl <= wlMax)
        v += 0.85 * Math.exp(-0.5 * Math.pow((wl - info.wl) / 14, 2));
      (info.sec || []).forEach(s => {
        if (s >= wlMin && s <= wlMax) v += 0.45 * Math.exp(-0.5 * Math.pow((wl - s) / 10, 2));
      });
    }
    v = Math.min(1, v);
    d += (i === 0 ? 'M' : 'L') + ` ${x(wl).toFixed(2)} ${y(v).toFixed(2)} `;
  }
  const fillPath = d + ` L ${x(wlMax).toFixed(2)} ${y(0).toFixed(2)} L ${x(wlMin).toFixed(2)} ${y(0).toFixed(2)} Z`;

  let markers = '';
  if (info){
    if (info.wl >= wlMin && info.wl <= wlMax){
      markers += `<line x1="${x(info.wl)}" y1="${padT}" x2="${x(info.wl)}" y2="${padT+plotH}" stroke="${col}" stroke-width="1" stroke-dasharray="4 3" opacity="0.55"/>`;
      markers += `<circle cx="${x(info.wl)}" cy="${y(0.85)}" r="4" fill="${col}" stroke="#fff" stroke-width="1.5"/>`;
      markers += `<text x="${x(info.wl)}" y="${padT+12}" text-anchor="middle" font-size="10" fill="#475569">${info.wl} nm</text>`;
    }
    (info.sec || []).forEach(s => {
      if (s >= wlMin && s <= wlMax){
        markers += `<circle cx="${x(s)}" cy="${y(0.45)}" r="3" fill="${col}" opacity="0.75" stroke="#fff" stroke-width="1"/>`;
      }
    });
  }

  return `
    <div class="chart-box">
      <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">
        <rect x="${padL}" y="${padT}" width="${plotW}" height="${plotH}" fill="url(#visibleSpectrum)" opacity="0.13"/>
        ${grid}
        <line x1="${padL}" y1="${padT+plotH}" x2="${padL+plotW}" y2="${padT+plotH}" stroke="#94a3b8" stroke-width="1.2"/>
        <line x1="${padL}" y1="${padT}" x2="${padL}" y2="${padT+plotH}" stroke="#94a3b8" stroke-width="1.2"/>
        <text x="${padL+plotW/2}" y="${H-8}" text-anchor="middle" font-size="12" fill="#475569" font-weight="600">Longueur d'onde (nm)</text>
        <text x="14" y="${padT+plotH/2}" text-anchor="middle" font-size="12" fill="#475569" font-weight="600" transform="rotate(-90 14 ${padT+plotH/2})">Intensité relative</text>
        <path d="${fillPath}" fill="${col}" opacity="0.22"/>
        <path d="${d}" fill="none" stroke="${col}" stroke-width="2.5"/>
        ${markers}
      </svg>
    </div>`;
}

/* =========================================================================
   6. RENDU GLOBAL
   ========================================================================= */
function render(){
  renderSidebar();
  renderMain();
}

document.addEventListener('DOMContentLoaded', render);
</script>
